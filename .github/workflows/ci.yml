name: ocp-freecad-cam-ci
on:
  schedule:
   - cron: "30 23 * * 1,5"
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read


# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  commitlint:
    name: Check commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run commitlint
        uses: wagoid/commitlint-github-action@3d28780bbf0365e29b144e272b2121204d5be5f3  # v6.1.2

  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Run pre-commit
      uses: pre-commit/action@v3.0.1

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        release: ["1.1.4"]
        python: [ "3.11" ]
        # exclude:
        include:
        #   - python: "3.11"
        #     release: "latest"
        #     os: "ubuntu-latest"
        #     primary: true
          - python: "3.11"
            pypattern: "py311"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Required by SonarCloud
          fetch-depth: 0

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Setup FreeCAD (macOS)
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE: ${{ matrix.release }}
          PYPATTERN: ${{ matrix.pypattern }}
          PYVER: ${{ matrix.python }}
        run: |
          mkdir $PWD/freecad
          cd $PWD/freecad
          TAG_ARGS=()
          if [ "${RELEASE}" != "latest" ]; then
            TAG_ARGS=("${RELEASE}")
          fi
          URL=$(gh release view "${TAG_ARGS[@]}" --repo FreeCAD/FreeCAD --json assets --jq ".assets[] | select(.name | contains(\"macOS-arm64\") and contains(\"${PYPATTERN}\") and endswith(\".dmg\")) | .url" | head -n 1)
          if [ -z "$URL" ]; then
            echo "Did not find FreeCAD asset matching macOS-arm64, ${PYPATTERN}, .dmg" >&2
            exit 1
          fi
          curl -L -o freecad.dmg "$URL"
          hdiutil attach freecad.dmg -mountpoint /Volumes/FreeCAD -nobrowse -quiet
          cp -r "/Volumes/FreeCAD/FreeCAD.app" .
          hdiutil detach /Volumes/FreeCAD -quiet

          $PWD/FreeCAD.app/Contents/Resources/bin/python -m venv --system-site-packages venv
          echo "$PWD/FreeCAD.app/Contents/Resources/lib" > venv/lib/python${PYVER}/site-packages/freecad.pth
          echo "$PWD/../src" > venv/lib/python${PYVER}/site-packages/ocp_freecad_cam.pth

      - name: Setup FreeCAD (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE: ${{ matrix.release }}
          PYPATTERN: ${{ matrix.pypattern }}
          PYVER: ${{ matrix.python }}
        run: |
          mkdir $PWD/freecad
          cd $PWD/freecad
          TAG_ARGS=()
          if [ "${RELEASE}" != "latest" ]; then
            TAG_ARGS=("${RELEASE}")
          fi
          URL=$(gh release view "${TAG_ARGS[@]}" --repo FreeCAD/FreeCAD --json assets --jq ".assets[] | select(.name | contains(\"Linux-x86_64\") and contains(\"${PYPATTERN}\") and endswith(\".AppImage\")) | .url" | head -n 1)
          if [ -z "$URL" ]; then
            echo "Did not find FreeCAD asset matching Linux-x86_64, ${PYPATTERN}, .AppImage" >&2
            exit 1
          fi
          wget -O freecad.AppImage "$URL"
          chmod +x freecad.AppImage
          ./freecad.AppImage --appimage-extract > /dev/null

          $PWD/squashfs-root/usr/bin/python -m venv --system-site-packages venv
          echo "$PWD/squashfs-root/usr/lib" > venv/lib/python${PYVER}/site-packages/freecad.pth
          echo "$PWD/../src" > venv/lib/python${PYVER}/site-packages/ocp_freecad_cam.pth

      - name: Setup FreeCAD (Windows)
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE: ${{ matrix.release }}
          PYPATTERN: ${{ matrix.pypattern }}
          PYVER: ${{ matrix.python }}
        run: |
          mkdir freecad
          cd freecad
          $tagArgs = if ($env:RELEASE -ne "latest") { @($env:RELEASE) } else { @() }
          $assets = (gh release view @tagArgs --repo FreeCAD/FreeCAD --json assets | ConvertFrom-Json).assets
          $urlPath = ($assets | Where-Object { $_.name -like "*Windows-x86_64*" -and $_.name -like "*$env:PYPATTERN*" -and $_.name.EndsWith(".7z") } | Select-Object -First 1).url
          if (-not $urlPath) { throw "Did not find FreeCAD asset matching Windows-x86_64, $env:PYPATTERN, .7z" }
          Invoke-WebRequest -Uri $urlPath -OutFile "freecad.7z"

          7z x freecad.7z
          Invoke-Expression (".\" + (Get-ChildItem . "FreeCAD_*" | select -first 1).Name + "\bin\python -m venv --system-site-packages venv")
          "$($PWD)\..\src" | Out-File -FilePath "venv\Lib\site-packages\ocp_freecad_cam.pth"

      - name: Test FreeCAD is available (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          source freecad/venv/bin/activate
          echo $PYTHONPATH
          python -c "import sys; print(sys.path)"
          python -c "import FreeCAD"

      - name: Test FreeCAD is available (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          .\freecad\venv\Scripts\activate
          echo $PYTHONPATH
          python -c "import sys; print(sys.path)"
          python -c "import FreeCAD"

      - name: Install dependencies (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          source freecad/venv/bin/activate
          python -m pip install --upgrade pip
          pip install --ignore-installed cadquery build123d
          pip install --ignore-installed -r requirements-dev.txt

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          .\freecad\venv\Scripts\activate
          python -m pip install --upgrade pip
          pip install --ignore-installed cadquery build123d
          pip install --ignore-installed -r requirements-dev.txt

      - name: Check ruff format
        if: matrix.primary
        run: |
          source freecad/venv/bin/activate
          ruff format --check src tests

      - name: Check ruff lint
        if: matrix.primary
        run: |
          source freecad/venv/bin/activate
          ruff check src tests

      - name: Run tests (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          source freecad/venv/bin/activate
          python -m pytest -ra -vvv --cov=src --cov-report=xml tests

      - name: Run tests (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          source freecad/venv/bin/activate
          pip install pytest-xdist
          python -m pytest -n auto -ra -vvv tests

      - name: Run tests (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          .\freecad\venv\Scripts\activate
          # We use pytest-xdist on Windows because it gets rid of a silly issue
          # which causes normal pytest to exit with exit code 1 even though all
          # tests pass. That's probably segfault / access violation on Windows
          # when cleaning up, so it's not terribly relevant to our test session.
          pip install pytest-xdist
          python -m pytest -n auto -ra -vvv tests

      - name: Override coverage report source path for SonarCloud
        if: matrix.primary
        run: sed -i 's@'$GITHUB_WORKSPACE'@/github/workspace/@g' coverage.xml

      - name: SonarCloud Scan
        if: matrix.primary
        uses: SonarSource/sonarqube-scan-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
